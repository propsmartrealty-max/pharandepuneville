<svg viewBox="0 0 240 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Architectural Monument Crest Icon -->
  <g transform="translate(4, 8)">
    <rect width="44" height="44" rx="12" fill="url(#crestBorder)" />
    <rect x="2" y="2" width="40" height="40" rx="10" fill="#0F172A" />
    
    <!-- Sun / Sky Glow -->
    <circle cx="22" cy="22" r="16" fill="url(#skyGlow)" opacity="0.25" />

    <!-- 3 High-Rise Towers in background -->
    <rect x="9" y="14" width="6" height="20" rx="1.5" fill="#E2E8F0" opacity="0.85" />
    <rect x="18" y="9" width="8" height="25" rx="1.5" fill="#F8FAFC" />
    <rect x="29" y="15" width="6" height="19" rx="1.5" fill="#CBD5E1" opacity="0.85" />

    <!-- Modernist Tower Vertical Striations -->
    <line x1="12" y1="17" x2="12" y2="30" stroke="#0F172A" stroke-width="0.8" stroke-dasharray="1.5 1.5" />
    <line x1="22" y1="12" x2="22" y2="30" stroke="#0F172A" stroke-width="0.9" stroke-dasharray="1.5 1.5" />
    <line x1="32" y1="18" x2="32" y2="30" stroke="#0F172A" stroke-width="0.8" stroke-dasharray="1.5 1.5" />

    <!-- Sweeping Architectural Canopy Arch (Entrance Pavilion) -->
    <path d="M 5 28 C 12 25, 24 27, 39 31 L 39 34 C 24 30, 12 28, 5 32 Z" fill="url(#goldCanopy)" />

    <!-- 3D Monument Plinth Base -->
    <path d="M 8 34 L 36 34 L 34 37 L 10 37 Z" fill="#D4AF37" />
  </g>

  <!-- Typographic Monument Wordmark -->
  <text x="58" y="32" font-family="Outfit, Lexend, system-ui, sans-serif" font-size="22" font-weight="900" letter-spacing="3.2" fill="#0F172A">
    PUNEVILLE
  </text>
  <text x="59" y="44" font-family="Outfit, Lexend, system-ui, sans-serif" font-size="7.5" font-weight="700" letter-spacing="2.2" fill="#64748B">
    BY PHARANDE SPACES
  </text>

  <defs>
    <linearGradient id="crestBorder" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBBF24" />
      <stop offset="0.5" stop-color="#F59E0B" />
      <stop offset="1" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="skyGlow" x1="22" y1="6" x2="22" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDE68A" />
      <stop offset="1" stop-color="#D97706" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="goldCanopy" x1="5" y1="25" x2="39" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDE68A" />
      <stop offset="0.5" stop-color="#F59E0B" />
      <stop offset="1" stop-color="#B45309" />
    </linearGradient>
  </defs>
</svg>
